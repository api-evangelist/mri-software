apis:
- aid: mri-software:mri-information-exchange-api
  name: MRI Information Exchange (MIX) API
  description: >-
    An open and connected ecosystem of secure REST APIs built by MRI and its partners that enables controlled
    data exchange between MRI's core property management and accounting platform and third-party or custom
    applications. Over 1,000 unique APIs operate within the MIX environment, all vetted by MRI engineers
    for security and integrity.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.mrisoftware.com/products/mri-information-exchange/
  tags:
  - Property Management
  - Accounting
  - Integration
  - Real Estate
  tags_raw:
  - Property Management
  - Accounting
  - Integration
  - Real Estate
  - Real-Estate
