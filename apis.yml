aid: mri-software

name: MRI Software

description: MRI Software is a real estate technology platform serving over 45,000 clients across 170+ countries. It provides REST APIs and an
  open integration ecosystem for property management, investment management, lease accounting, facilities management, visitor and contractor management,
  and commercial real estate analytics. The MRI Information Exchange (MIX) hosts over 1,000 vetted APIs for data exchange between MRI's core platform
  and third-party or custom applications.

