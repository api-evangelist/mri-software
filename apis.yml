- aid: mri-software:mri-software-induction-courses-api
  name: MRI Software Induction courses API
  description: >-
    <p>Induction courses are to record if an employee or contractor has completed required training. There
    are four types of induction course in OnLocation: internal, external, eLearning and SCORM Cloud. The
    first two options are used to record that training has been completed; last two options are used to
    deliver online training.  An induction course record includes the basic course information, it doesn't
    include any course content.</p><p>Use the induction API to retrieve your induction course list, create
    an induction course, and update or delete an induction course. You can also return a list of learners
    that hold a specific induction, add inductions to employee or contractor profiles, and update or delete
    a specific learner record.</p><p>Learn more about induction courses in the <a href='https://onlocation.elevio.help/en/articles/639'
