    url: https://www.mrisoftware.com/products/mri-information-exchange/
  - type: IntegrationsGuide
    url: https://www.mrisoftware.com/wp-content/uploads/2018/01/MRI-API-Integrations-Guide-5.pdf
- aid: mri-software:mri-property-management-api
  name: MRI Property Management X API
  description: >-
    REST APIs providing programmatic access to MRI's core property management platform, covering residential
    and commercial property portfolios, units, leases, resident ledgers, maintenance work orders, and
    AP workflows. Authentication uses OAuth 2.0 with TLS 1.2+ encryption. Access is provisioned through
    the myMRI client portal.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.mrisoftware.com/mrifunctionalspecs/
