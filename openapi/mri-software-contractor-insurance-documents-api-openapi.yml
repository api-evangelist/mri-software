openapi: 3.2.0
info:
  title: Mri Software Contractor insurance documents API
  version: '0.1'
  contact:
    email: support@whosonlocation.com
  description: 'Operations tagged Contractor insurance documents across 2 of this provider''s published API definitions: mri-software-onlocation-openapi.json, mri-software-onlocation-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.whosonlocation.com/v1
tags:
- name: Contractor insurance documents
  description: 'Contractor organization insurance policies can have documents attached to them. Use the API to retrieve a list of all documents attached to a policy, add new documents, and update or delete existing documents.


    Learn more about insurances in the OnLocation Help Center.'
paths:
  /sp/insurance/{id}/document:
    get:
      tags:
      - Contractor insurance documents
      summary: List all documents for a policy
      description: Retrieve all documents attached to a contractor insurance policy.
      operationId: getContractorInsuranceDocumentsList
      parameters:
      - name: id
        in: path
        description: ID of the contractor insurance record
        required: true
        schema:
          type: integer
          format: int32
        example: id=140
      responses:
        '200':
          description: List of contractor insurance documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentResponse'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentResponse'
        '403':
          description: Access denied to resource
        '404':
          description: Resource not found
        '500':
          description: Internal server error
    post:
      tags:
      - Contractor insurance documents
      summary: Update a policy document
      description: Add a new document to a contractor insurance policy.
      operationId: saveContractorInsuranceDocument
      parameters:
      - name: id
        in: path
        description: ID of the contractor insurance
        required: true
        schema:
          type: integer
          format: int32
        example: id=140
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              required:
              - file
              properties:
                file:
                  description: Insurance policy document to add
                  type: string
                  format: file
              type: object
      responses:
        '200':
          description: Resource created
        '403':
          description: Access denied to this resource
        '500':
          description: Internal server error
    servers:
    - url: https://api.whosonlocation.com/v1
  /sp/insurance/{id}/document/{did}:
    get:
      tags:
      - Contractor insurance documents
      summary: Retrieve a policy document
      description: Retrieves a single contractor insurance policy document, filtering with the provided ID.
      operationId: getContractorInsuranceDocument
      parameters:
      - name: id
        in: path
        description: ID of the contractor insurance record
        required: true
        schema:
          type: integer
          format: int32
        example: id=140
      - name: did
        in: path
        description: ID of the contractor insurance document
        required: true
        schema:
          type: integer
          format: int32
        example: did=70
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '403':
          description: Access denied to resource
        '404':
          description: Resource not found
        '500':
          description: Internal server error
    delete:
      tags:
      - Contractor insurance documents
      summary: Delete a policy document
      description: Deletes the specified contractor insurance document
      operationId: deleteContractorInsuranceDocument
      parameters:
      - name: id
        in: path
        description: ID of the contractor insurance
        required: true
        schema:
          type: integer
          format: int32
        example: id=140
      - name: did
        in: path
        description: ID of the contractor insurance document to delete
        required: true
        schema:
          type: integer
          format: int32
        example: did=70
      responses:
        '204':
          description: Document deleted
        '403':
          description: Access denied to resource
        '404':
          description: Resource not found
        '500':
          description: Internal server error
    servers:
    - url: https://api.whosonlocation.com/v1
components:
  schemas:
    DocumentResponse:
      properties:
        id:
          type: integer
          format: int32
          example: 70
        modified:
          type: string
          format: date-time
          example: '2021-11-29T08:12:24+13:00'
        name:
          type: string
          format: string
          example: file-example
        type:
          type: string
          format: string
          example: pdf
        size:
          type: integer
          format: int64
          example: 469513
        link:
          type: string
          format: string
          example: https://your.site.com/storage/file-example.pdf
      type: object
x-refined-from:
- mri-software-onlocation-openapi.json
- mri-software-onlocation-openapi.yml
