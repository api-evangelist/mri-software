openapi: 3.2.0
info:
  title: Mri Software Visitor events API
  version: '0.1'
  contact:
    email: support@whosonlocation.com
  description: 'Operations tagged Visitor events across 2 of this provider''s published API definitions: mri-software-onlocation-openapi.json, mri-software-onlocation-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.whosonlocation.com/v1
tags:
- name: Visitor events
  description: 'A visitor event is a record listing the details of a visit, including the visitor''s name, where they visited, contact details, basic question answers, and sign in/out mode and time.


    Use the visitor event API to retrieve your visitor event list, add a new visitor event, or update or delete a visitor event.'
paths:
  /visitor/event:
    get:
      tags:
      - Visitor events
      summary: List all visitor events
      description: 'Returns a list of visitor sign in and out events.


        A comma separated list of tag:value search parameters, a colon separator performs an exact match, a percent separator performs a starts-with search and greater/less than search number/date ranges.'
      operationId: getVisitorEventList
      parameters:
      - name: q
        in: query
        description: Filter by any visitor event value.
        required: false
        schema:
          type: string
          format: string
        example: location_id:100
      - name: order
        in: query
        description: Order by any element returned, prefix with a - to reverse order.
        required: false
        schema:
          type: string
          format: string
        example: location_id
      - name: limit
        in: query
        description: 'Limits the amount of records to return. '
        required: false
        schema:
          type: integer
          format: date-string
        example: '10'
      - name: If-Modified-Since
        in: header
        description: A UTC timestamp (yyyy-mm-ddThh:mm:ss) . Only entities created or modified since this timestamp will be returned e.g. 2009-11-12T00:00:00
        required: false
        schema:
          type: string
          format: int32
      responses:
        '200':
          description: List of visitor sign in and out events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VisitorEventResponse'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VisitorEventResponse'
        '403':
          description: Access denied to this resource
        '404':
          description: Resource not found
        '500':
          description: Internal server error
    post:
      tags:
      - Visitor events
      summary: Create a visitor event
      description: Creates a new visitor sign in and out event.
      operationId: createVisitorEvent
      requestBody:
        description: ''
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitorEventPostRequest'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorEventResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/VisitorEventResponse'
        '403':
          description: Access denied to this resource
        '500':
          description: Internal server error
    servers:
    - url: https://api.whosonlocation.com/v1
  /visitor/event/{id}:
    get:
      tags:
      - Visitor events
      summary: Retrieve a visitor event
      description: Retrieves a single visitor sign in and out event, filtering with the provided ID.
      operationId: getVisitorEvent
      parameters:
      - name: id
        in: path
        description: ID of the visitor sign in and out event to retrieve
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Event returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorEventResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/VisitorEventResponse'
        '403':
          description: Access denied to resource
        '404':
          description: Resource not found
        '500':
          description: Internal server error
    put:
      tags:
      - Visitor events
      summary: Update a visitor event
      description: Updates a visitor sign in and out event based on the provided ID.
      operationId: updateVisitorEvent
      parameters:
      - name: id
        in: path
        description: ID of the visitor event to update
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        description: Information used to create the visitor event record
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitorEventPutRequest'
      responses:
        '204':
          description: Updated event
        '403':
          description: Access denied to this resource
        '500':
          description: Internal server error
    delete:
      tags:
      - Visitor events
      summary: Delete a visitor event
      description: Deletes the specified visitor sign in and out event.
      operationId: deleteVisitorEvent
      parameters:
      - name: id
        in: path
        description: ID of the visitor sign in/out event to delete
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '204':
          description: Event deleted
        '403':
          description: Access denied to resource
        '404':
          description: Resource not found
        '500':
          description: Internal server error
    servers:
    - url: https://api.whosonlocation.com/v1
