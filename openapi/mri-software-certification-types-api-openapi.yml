openapi: 3.2.0
info:
  title: Mri Software Certification types API
  version: '0.1'
  contact:
    email: support@whosonlocation.com
  description: 'Operations tagged Certification types across 2 of this provider''s published API definitions: mri-software-onlocation-openapi.json, mri-software-onlocation-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.whosonlocation.com/v1
tags:
- name: Certification types
  description: 'Certification types are used to group similar types of certifications, for example qualifications, certificates, licenses, degrees. Use the API to return the full list of certification types, or add, update or delete a certification type.


    Learn more about certification types in the OnLocation Help Center.'
paths:
  /certification/types:
    get:
      tags:
      - Certification types
      summary: List all certification types
      description: 'Retrieves a list of all certification types.


        A comma separated list of tag:value search parameters, a colon separator performs an exact match, a percent separator performs a starts-with search and greater/less than search number/date ranges.'
      operationId: getCertificationTypeList
      responses:
        '200':
          description: List of certification types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CertificationTypeResponse'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CertificationTypeResponse'
        '403':
          description: Access denied to this resource
        '404':
          description: Resource not found
        '500':
          description: Internal server error
    post:
      tags:
      - Certification types
      summary: Create a certification type
      description: Adds a new certification type to assign to a certification.
      operationId: createCertificationType
      requestBody:
        description: 'Type of certification to add:'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificationTypeRequest'
      responses:
        '201':
          description: Certification type created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificationTypeResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/CertificationTypeResponse'
        '403':
          description: Access denied to this resource
        '409':
          description: Type already exists
        '500':
          description: Internal server error
    servers:
    - url: https://api.whosonlocation.com/v1
  /certification/types/{id}:
    get:
      tags:
      - Certification types
      summary: Retrieve a certification type
      description: Retrieves a single certification type, filtering with the provided ID.
      operationId: getCertificationType
      parameters:
      - name: id
        in: path
        description: ID of the certification type to retrieve
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Certification type response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificationTypeResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/CertificationTypeResponse'
        '403':
          description: Access denied to resource
        '404':
          description: Resource not found
        '500':
          description: Internal server error
    put:
      tags:
      - Certification types
      summary: Update a certification type
      description: Updates a single certification type.
      operationId: updateCertificationType
      parameters:
      - name: id
        in: path
        description: ID of the certification type to update
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        description: Information used to create the certification type record
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificationTypeRequest'
      responses:
        '200':
          description: Updated certification type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificationTypeResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/CertificationTypeResponse'
        '403':
          description: Access denied to this resource
        '500':
          description: Internal server error
    delete:
      tags:
      - Certification types
      summary: Delete a certification type
      description: Deletes the specified certification type.
      operationId: deleteCertificationType
      parameters:
      - name: id
        in: path
        description: ID of the Certification Type to delete
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '204':
          description: Certification type deleted
        '403':
          description: Access denied to resource
        '404':
          description: Resource not found
        '500':
          description: Internal server error
    servers:
    - url: https://api.whosonlocation.com/v1
components:
  schemas:
    CertificationTypeResponse:
      properties:
        id:
          type: integer
          format: int32
          example: 79
        created:
          type: string
          format: date-time
          example: '2021-11-26T14:33:41+13:00'
        modified:
          type: string
          format: date-time
          example: '2022-11-26T14:33:41+13:00'
        name:
          type: string
          format: string
          example: Certificate
      type: object
    CertificationTypeRequest:
      properties:
        name:
          type: string
          format: string
          example: Diploma
      type: object
x-refined-from:
- mri-software-onlocation-openapi.json
- mri-software-onlocation-openapi.yml
