openapi: 3.2.0
info:
  title: Mri Software Contractor organization categories API
  version: '0.1'
  contact:
    email: support@whosonlocation.com
  description: 'Operations tagged Contractor organization categories across 2 of this provider''s published API definitions: mri-software-onlocation-openapi.json, mri-software-onlocation-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.whosonlocation.com/v1
tags:
- name: Contractor organization categories
  description: 'Categories are used to describe the different functions of your contractor organizations. You can use them to sort your organizations and make it easier to report on them and create triggers.


    Use the API to retrieve your categories list or add, update or delete a category.


    Learn more about contractor organization categories in the OnLocation Help Center.'
paths:
  /sp/org/category:
    get:
      tags:
      - Contractor organization categories
      summary: List of contractor organization categories
      description: Returns a list of contractor organization categories.
      operationId: getSpCategoryList
      responses:
        '200':
          description: List of contractor organization categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpCategoryResponse'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpCategoryResponse'
        '400':
          description: Invalid Input
        '403':
          description: Access denied to this resource
        '500':
          description: Internal server error
    post:
      tags:
      - Contractor organization categories
      summary: Create a contractor organization category
      description: Creates a new contractor organization category with the provided details.
      operationId: createSpCategory
      requestBody:
        description: Information used to create a new contractor organization category
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpCategoryRequest'
      responses:
        '201':
          description: Created resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpCategoryResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SpCategoryResponse'
        '400':
          description: Invalid input
        '403':
          description: Access denied to this resource
        '500':
          description: Internal server error
    servers:
    - url: https://api.whosonlocation.com/v1
  /sp/org/category/{id}:
    get:
      tags:
      - Contractor organization categories
      summary: Retrieve a contractor organization category
      description: Retrieves a contractor organization category by its ID.
      operationId: getSpCategory
      parameters:
      - name: id
        in: path
        description: ID of the contractor organization category to retrieve
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Contractor organization category found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpCategoryResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SpCategoryResponse'
        '403':
          description: Access denied to this resource
        '404':
          description: Contractor organization category not found
        '500':
          description: Internal server error
    put:
      tags:
      - Contractor organization categories
      summary: Update a contractor organization category
      description: Updates the details of a contractor organization category.
      operationId: updateSpCategory
      parameters:
      - name: id
        in: path
        description: ID of the contractor organization category to update
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        description: Information used to update the contractor organization category record
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpCategoryRequest'
      responses:
        '200':
          description: Updated resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpCategoryResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SpCategoryResponse'
        '400':
          description: Invalid Input
        '403':
          description: Access denied to this resource
        '404':
          description: Contractor organization category not found
        '500':
          description: Internal server error
    delete:
      tags:
      - Contractor organization categories
      summary: Delete a contractor organization category
      description: Deletes a contractor organization category by its ID.
      operationId: deleteSpCategory
      parameters:
      - name: id
        in: path
        description: ID of the contractor organization category to delete
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Contractor organization category deleted successfully
        '403':
          description: Access denied to this resource
        '404':
          description: Contractor organization category not found
        '409':
          description: Not deleted as contractor organization groups found under this category
        '500':
          description: Internal server error
    servers:
    - url: https://api.whosonlocation.com/v1
components:
  schemas:
    SpCategoryResponse:
      title: SpCategoryResponse
      description: Contractor organization category response schema
      properties:
        id:
          description: Category ID
          type: integer
          format: int32
          example: 1
        name:
          description: Name of the category
          type: string
          format: string
          example: Transport Services
        created:
          description: Created time of the category
          type: string
          format: date-time
          example: '2023-05-12 09:30:00'
      type: object
    SpCategoryRequest:
      title: SpCategoryRequest
      description: Contractor organization category request schema
      properties:
        name:
          description: Name of the category
          type: string
          format: string
          example: Transport Services
      type: object
