openapi: 3.2.0
info:
  title: Mri Software Custom field tabs API
  version: '0.1'
  contact:
    email: support@whosonlocation.com
  description: 'Operations tagged Custom field tabs across 2 of this provider''s published API definitions: mri-software-onlocation-openapi.json, mri-software-onlocation-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.whosonlocation.com/v1
tags:
- name: Custom field tabs
  description: 'Users can add new tabs to organize the custom fields in their employee or contractor profiles. Use the custom fields API to retrieve any employee, contractor organization, and contractor member custom field tabs.


    Learn more about custom fields in the OnLocation Help Center.'
paths:
  /customfield/tab/{tab_type}:
    get:
      tags:
      - Custom field tabs
      summary: List all custom field tabs
      description: 'Retrieves a list of custom field tabs filtered by the parameter provided: employees, contractor organizations, or contractor members.


        A comma separated list of tag:value search parameters, a colon separator performs an exact match, a percent separator performs a starts-with search and greater/less than search number/date ranges.


        The endpoint is limited to a maximum of 1000 records.'
      operationId: getCustomFieldTabList
      parameters:
      - name: tab_type
        in: path
        description: 'Custom field element type to filter by. Options: ''staff'', ''sp-org'', ''sp-member''.'
        required: true
        schema:
          type: string
          format: string
        example: tab/sp-member
      - name: order
        in: query
        description: Specifies an element to order by. To order in reverse order, prepend the element with '-'.
        required: false
        schema:
          type: string
          format: string
        example: id
      - name: limit
        in: query
        description: Limits the amount of records to return
        required: false
        schema:
          type: integer
          format: int32
        example: '10'
      - name: page
        in: query
        description: Specifies which page of results to return, most effective when used together with the 'limit' parameter
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: List of custom tab elements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomfieldTab'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomfieldTab'
        '403':
          description: Access denied to this resource
        '404':
          description: Resource not found.
    servers:
    - url: https://api.whosonlocation.com/v1
components:
  schemas:
    CustomfieldTab:
      properties:
        id:
          type: integer
          format: int32
          example: 88
        created:
          type: string
          format: date-time
          example: '2021-11-25T12:14:32+13:00'
        modified:
          type: string
          format: date-time
          example: '2021-11-25T12:23:34+13:00'
        title:
          type: string
          format: string
          example: Profile Information
        sort:
          type: integer
          format: int32
          example: 2
        created_by:
          type: integer
          format: int32
          example: 823
        updated_by:
          type: integer
          format: int32
          example: 431
      type: object
x-refined-from:
- mri-software-onlocation-openapi.json
- mri-software-onlocation-openapi.yml
