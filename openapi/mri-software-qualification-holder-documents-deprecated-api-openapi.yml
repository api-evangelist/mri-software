openapi: 3.2.0
info:
  title: Mri Software Qualification holder documents (deprecated) API
  version: '0.1'
  contact:
    email: support@whosonlocation.com
  description: 'Operations tagged Qualification holder documents (deprecated) across 2 of this provider''s published API definitions: mri-software-onlocation-openapi.json, mri-software-onlocation-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.whosonlocation.com/v1
tags:
- name: Qualification holder documents (deprecated)
  description: The qualifications endpoints have been deprecated as Qualifications Management has been renamed Certifications Management. Use the certification holder documents endpoints to access this data.
paths:
  /qualification/{id}/holder/{hid}/document:
    post:
      tags:
      - Qualification holder documents (deprecated)
      summary: Add a qualification document
      description: Adds a new qualification holder document.
      operationId: saveQualificationHolderDocument
      parameters:
      - name: id
        in: path
        description: ID of the qualification
        required: true
        schema:
          type: integer
          format: int32
      - name: hid
        in: path
        description: ID of the qualification holder
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              required:
              - file
              properties:
                file:
                  description: file to upload
                  type: string
                  format: file
              type: object
      responses:
        '200':
          description: Document added
        '403':
          description: Access denied to this resource
        '500':
          description: Internal server error
      deprecated: true
    servers:
    - url: https://api.whosonlocation.com/v1
  /qualification/{id}/holder/{hid}/document/{did}:
    get:
      tags:
      - Qualification holder documents (deprecated)
      summary: Retrieve a qualification document
      description: Retrieves a qualification holder document, filtering with the provided ID.
      operationId: getQualificationHolderDocument
      parameters:
      - name: id
        in: path
        description: ID of the qualification
        required: true
        schema:
          type: integer
          format: int32
      - name: hid
        in: path
        description: ID of the qualification holder
        required: true
        schema:
          type: integer
          format: int32
      - name: did
        in: path
        description: ID of the document to retrieve
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The specified document to be retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '403':
          description: Access denied to resource
        '404':
          description: Resource not found
        '500':
          description: Internal server error
      deprecated: true
    delete:
      tags:
      - Qualification holder documents (deprecated)
      summary: Delete a qualification document
      description: Deletes the specified qualification holder document.
      operationId: deleteQualificationHolderDocument
      parameters:
      - name: id
        in: path
        description: ID of the qualification
        required: true
        schema:
          type: integer
          format: int32
      - name: hid
        in: path
        description: ID of the qualification holder
        required: true
        schema:
          type: integer
          format: int32
      - name: did
        in: path
        description: ID of the document to delete
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '204':
          description: Document deleted
        '403':
          description: Access denied to resource
        '404':
          description: Resource not found
        '500':
          description: Internal server error
      deprecated: true
    servers:
    - url: https://api.whosonlocation.com/v1
components:
  schemas:
    DocumentResponse:
      properties:
        id:
          type: integer
          format: int32
          example: 70
        modified:
          type: string
          format: date-time
          example: '2021-11-29T08:12:24+13:00'
        name:
          type: string
          format: string
          example: file-example
        type:
          type: string
          format: string
          example: pdf
        size:
          type: integer
          format: int64
          example: 469513
        link:
          type: string
          format: string
          example: https://your.site.com/storage/file-example.pdf
      type: object
x-refined-from:
- mri-software-onlocation-openapi.json
- mri-software-onlocation-openapi.yml
