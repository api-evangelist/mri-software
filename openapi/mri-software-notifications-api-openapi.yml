openapi: 3.2.0
info:
  title: Mri Software Notifications API
  version: '0.1'
  contact:
    email: support@whosonlocation.com
  description: 'Operations tagged Notifications across 2 of this provider''s published API definitions: mri-software-onlocation-openapi.json, mri-software-onlocation-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.whosonlocation.com/v1
tags:
- name: Notifications
  description: OnLocation sends email, SMS, and OnLocation Mobile push notifications. Use the notification API to retrieve a list of all notifications and provide a notification ID to retrieve a single notification.
paths:
  /notification:
    get:
      tags:
      - Notifications
      summary: List all notifications
      description: 'Returns a list of all notification records.


        Filter by any notification element. A comma separated list of tag:value search parameters, a colon separator performs an exact match, a percent separator performs a starts-with search and greater/less than search number/date ranges.'
      operationId: getNotificationList
      parameters:
      - name: q
        in: query
        description: Filter by notification value
        required: false
        schema:
          type: string
          format: string
        example: method:sms,location_id:7
      responses:
        '200':
          description: List of notification records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationResponse'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationResponse'
        '403':
          description: Access denied to this resource
        '404':
          description: Resource not found
    servers:
    - url: https://api.whosonlocation.com/v1
  /notification/{id}:
    get:
      tags:
      - Notifications
      summary: Retrieve a notification
      description: Retrieves a single notification, filtering with the provided ID.
      operationId: getNotification
      parameters:
      - name: id
        in: path
        description: ID of the notification to retrieve
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Notification returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '403':
          description: Access denied to resource
        '404':
          description: Resource not found
    servers:
    - url: https://api.whosonlocation.com/v1
