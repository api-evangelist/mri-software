openapi: 3.2.0
info:
  title: Mri Software Certification holder documents API
  version: '0.1'
  contact:
    email: support@whosonlocation.com
  description: 'Operations tagged Certification holder documents across 2 of this provider''s published API definitions: mri-software-onlocation-openapi.json, mri-software-onlocation-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.whosonlocation.com/v1
tags:
- name: Certification holder documents
  description: 'Each certification added to an employee or contractor profile can have a document attached. Use the API to return a list of certification documents, and update or delete a certification document.


    Learn more about certification documents in the OnLocation Help Center.'
paths:
  /certification/{id}/holder/{hid}/document:
    get:
      tags:
      - Certification holder documents
      summary: List of certification documents
      description: Retrieves a list of documents for a specified certification holder and specified certification
      operationId: getCertificationHolderDocuments
      parameters:
      - name: id
        in: path
        description: ID of the certification to retrieve holders for
        required: true
        schema:
          type: integer
          format: int32
      - name: hid
        in: path
        description: ID of the certification holder to retrieve
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: List of certification holder documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentResponse'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentResponse'
        '403':
          description: Access denied to resource
        '404':
          description: Resource not found
        '500':
          description: Internal server error
    post:
      tags:
      - Certification holder documents
      summary: Adds a certification document
      description: Adds a new certification holder document.
      operationId: saveCertificationHolderDocument
      parameters:
      - name: id
        in: path
        description: ID of the certification
        required: true
        schema:
          type: integer
          format: int32
      - name: hid
        in: path
        description: ID of the certification holder
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              required:
              - file
              properties:
                file:
                  description: file to upload
                  type: string
                  format: file
              type: object
      responses:
        '200':
          description: Document added
        '403':
          description: Access denied to this resource
        '500':
          description: Internal server error
    servers:
    - url: https://api.whosonlocation.com/v1
  /certification/{id}/holder/{hid}/document/{did}:
    get:
      tags:
      - Certification holder documents
      summary: Retrieve a certification document
      description: Retrieves a certification holder document, filtering with the provided ID
      operationId: getCertificationHolderDocument
      parameters:
      - name: id
        in: path
        description: ID of the certification to retrieve holders for
        required: true
        schema:
          type: integer
          format: int32
      - name: hid
        in: path
        description: ID of the certification holder to retrieve
        required: true
        schema:
          type: integer
          format: int32
      - name: did
        in: path
        description: ID of the document to retrieve
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The specified document to be retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '403':
          description: Access denied to resource.
        '404':
          description: Resource not found
        '500':
          description: Internal server error
    delete:
      tags:
      - Certification holder documents
      summary: Delete a certification document
      description: Deletes the specified certification holder document.
      operationId: deleteCertificationHolderDocument
      parameters:
      - name: id
        in: path
        description: ID of the certification
        required: true
        schema:
          type: integer
          format: int32
      - name: hid
        in: path
        description: ID of the certification holder association
        required: true
        schema:
          type: integer
          format: int32
      - name: did
        in: path
        description: ID of the document to delete
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '204':
          description: Resource Deleted
        '403':
          description: Access denied to resource
        '404':
          description: Resource not found
        '500':
          description: Internal server error
    servers:
    - url: https://api.whosonlocation.com/v1
components:
  schemas:
    DocumentResponse:
      properties:
        id:
          type: integer
          format: int32
          example: 70
        modified:
          type: string
          format: date-time
          example: '2021-11-29T08:12:24+13:00'
        name:
          type: string
          format: string
          example: file-example
        type:
          type: string
          format: string
          example: pdf
        size:
          type: integer
          format: int64
          example: 469513
        link:
          type: string
          format: string
          example: https://your.site.com/storage/file-example.pdf
      type: object
x-refined-from:
- mri-software-onlocation-openapi.json
- mri-software-onlocation-openapi.yml
