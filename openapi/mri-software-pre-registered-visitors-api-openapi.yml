openapi: 3.2.0
info:
  title: Mri Software Pre-registered visitors API
  version: '0.1'
  contact:
    email: support@whosonlocation.com
  description: 'Operations tagged Pre-registered visitors across 2 of this provider''s published API definitions: mri-software-onlocation-openapi.json, mri-software-onlocation-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.whosonlocation.com/v1
tags:
- name: Pre-registered visitors
  description: 'A pre-registered visitor is someone who has been approved by an employee to visit a location. Each visitor is linked to a visit event. Use the pre-registered visitor API to retrieve your pre-registered visitor events list, add a new pre-registered visitor event, or update or delete a pre-registered visitor event.


    Learn more about pre-registered visitors in the OnLocation Help Center.'
paths:
  /visitor/register:
    get:
      tags:
      - Pre-registered visitors
      summary: List all pre-registered visitor events
      description: 'Returns a list of all pre-registered visitors and groups.


        A comma separated list of tag:value search parameters, a colon separator performs an exact match, a percent separator performs a starts-with search and greater/less than search number/date ranges.'
      operationId: getVisitorRegisterList
      parameters:
      - name: q
        in: query
        description: Filter by pre-registered visitor value.
        required: false
        schema:
          type: string
          format: string
        example: location_id:100
      responses:
        '200':
          description: List of pre-registered visitors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VisitorRegisterResponse'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VisitorRegisterResponse'
        '403':
          description: Access denied to this resource.
        '404':
          description: Resource not found
        '500':
          description: Internal server error
    post:
      tags:
      - Pre-registered visitors
      summary: Create a pre-registered visitor event
      description: Add a new pre-registered visitor event
      operationId: createVisitorRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitorRegisterRequest'
      responses:
        '201':
          description: Pre-registered visitor event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorRegisterRequest'
        '403':
          description: Access denied to this resource
        '500':
          description: Internal server error
    servers:
    - url: https://api.whosonlocation.com/v1
  /visitor/register/{id}:
    get:
      tags:
      - Pre-registered visitors
      summary: Retrieve a pre-registered visitor event
      description: Retrieves a single pre-registered visitor, filtering with the provided ID
      operationId: getVisitorRegister
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: A single pre-registered visitor record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorRegisterResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/VisitorRegisterResponse'
        '403':
          description: Access denied to resource
        '404':
          description: Resource not found
        '500':
          description: Internal server error
    put:
      tags:
      - Pre-registered visitors
      summary: Update a pre-registered visitor event
      description: Updates the specified pre-registered visitor event
      operationId: updateVisitorRegister
      parameters:
      - name: id
        in: path
        description: ID of the pre-registered visitor event to update
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        description: Information used to create the pre-registered visitor event record
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitorRegisterRequest'
      responses:
        '204':
          description: Updated pre-registered visitor event
        '403':
          description: Access denied to this resource
        '500':
          description: Internal server error
    delete:
      tags:
      - Pre-registered visitors
      summary: Delete a pre-registered visitor event
      description: Removes the specified pre-registered visitor event.
      operationId: deleteVisitorRegister
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '204':
          description: Pre-registered visitor event deleted
        '403':
          description: Access denied to resource
        '404':
          description: Resource not found
        '500':
          description: Internal server error
    servers:
    - url: https://api.whosonlocation.com/v1
